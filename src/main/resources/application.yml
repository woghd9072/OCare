spring:
  application:
    name: oncare

  datasource:
    # docker-compose 로 띄운 MySQL 을 사용한다.
    # 접속 정보는 환경변수로 덮어쓸 수 있게 두어 실행 환경이 바뀌어도 파일 수정이 필요 없게 한다.
    # rewriteBatchedStatements: 다건 INSERT 를 하나의 구문으로 합쳐 대량 수집 성능을 확보한다.
    # allowPublicKeyRetrieval: MySQL 8 기본 인증(caching_sha2)을 비 SSL 로컬 연결에서 사용하기 위함.
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/oncare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # database 0 = 애플리케이션용. 테스트는 1번을 사용해 데이터가 섞이지 않게 한다.
      database: 0

  jpa:
    hibernate:
      # 스키마의 소유권은 Flyway 마이그레이션에 있다.
      # Hibernate 가 임의로 DDL 을 바꾸면 DECIMAL 정밀도나 UNIQUE 제약이 어긋날 수 있어 검증만 수행한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 수집 데이터의 집계 기준일(measured_date)이 KST 기준이므로 JDBC 타임존을 고정한다.
          # 이 값이 어긋나면 일별 집계 경계가 하루씩 밀린다.
          time_zone: Asia/Seoul
          # 1회 수집 페이로드가 최대 1,500여 건이므로 배치 INSERT 로 처리한다.
          batch_size: 500
        order_inserts: true
        order_updates: true

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
