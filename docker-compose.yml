services:
  # 개발/테스트용 MySQL 8.x
  # 컨테이너 타임존을 Asia/Seoul 로 고정한다.
  mysql:
    image: mysql:8.0
    container_name: ocare-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ocare
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      # 테스트 전용 스키마(ocare_test)를 최초 기동 시 함께 생성한다
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ocare-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 수집 멱등성 키 / RefreshToken / 조회 캐시 용도
  # 애플리케이션은 db 0, 테스트는 db 1 을 사용해 데이터가 섞이지 않게 한다.
  redis:
    image: redis:7-alpine
    container_name: ocare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ocare-mysql-data:
